name: Build and Publish JobRunner Container

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/mentaldesk/truman-jobrunner

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fork PRs build to prove they compile, but never publish and never receive secrets.
      # See AGENTS.md for how to give a fork PR a real preview deployment.
      PUBLISH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      HAS_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer needs tags and set-commits needs the commit range, so not a shallow clone.
          fetch-depth: 0

      # Computed here rather than in the container build, which has no .git: the build context
      # is ./src and .git is both outside it and in .dockerignore.
      - name: Compute version
        id: version
        run: |
          dotnet tool install --global minver-cli --version 6.0.0
          V=$(minver -t v)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Truman.JobRunner/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      # Powers suspect commits. Done here, not via SentrySetCommitOptions=--local, because the
      # container build has no git history. Dependabot runs get their own secret store, so a
      # same-repo PR can still arrive without a token.
      - name: Associate commits with the release
        if: env.HAS_SENTRY_TOKEN == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mental-desk-ltd
          SENTRY_PROJECT: truman
          RELEASE: Truman.JobRunner@${{ steps.version.outputs.version }}
        run: |
          npx @sentry/cli releases set-commits "$RELEASE" --auto --ignore-missing

