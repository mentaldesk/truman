name: Build & Test

on:
  # Every PR is built and tested, including PRs from forks. This workflow needs no
  # secrets, which is what makes it safe to run against untrusted code.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
            path: ~/.nuget/packages
            key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
            restore-keys: |
              nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore truman.sln

      # Symbol/source upload and Sentry release creation belong to the container
      # workflows, which build the images we actually deploy. Doing it here too would
      # create a Sentry release per branch build and would require a secret this
      # workflow deliberately does not have.
      - name: Build
        run: dotnet build truman.sln --configuration Release --no-restore -p:UseSentryCLI=false

      # Note the extra `--` before the MTP parameters so that dotnet doesn't try to parse these
      - name: Test (with coverage)
        run: |
          dotnet test truman.sln \
            --configuration Release \
            --no-build \
            -- \
            --report-trx \
            --report-trx-filename test-results.trx \
            --coverage --coverage-output-format cobertura \
            --coverage-output ./TestResults/coverage/coverage.cobertura.xml

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/*.log
            **/TestResults/coverage/*.xml
          if-no-files-found: ignore

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: mentaldesk/truman
          files: '**/TestResults/coverage/coverage.cobertura.xml'
          # Fork PRs get no CODECOV_TOKEN and fall back to tokenless upload, so a
          # failure there must not fail an otherwise-green build.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          verbose: true

